  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    :root {
      --bg-page: #1e1e1e;
      --bg-sidebar: #252526;
      --text-main: #d4d4d4;
      --text-muted: #aaa;
      --border-color: #333;
      --input-bg: #3c3c3c;
      --accent-color: #0e639c;
      --accent-hover: #1177bb;
      --gtm-banner-bg: #1c2d3d;
      --gtm-banner-border: #0e639c;
      --code-font: 'Fira Code', monospace;
    }

    body.light-mode {
      --bg-page: #f4f4f9;
      --bg-sidebar: #ffffff;
      --text-main: #222222;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --input-bg: #ffffff;
      --accent-color: #007acc;
      --accent-hover: #005999;
      --gtm-banner-bg: #e6f3ff;
      --gtm-banner-border: #99ccff;
    }

    body { background-color: var(--bg-page); color: var(--text-main); padding: 20px; transition: background-color 0.3s, color 0.3s; }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title-box h1 { color: #61dafb; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    body.light-mode .header-title-box h1 { color: #007acc; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; }

    /* Banner em Destaque no Topo para o Switch do GTM */
    .gtm-top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gtm-banner-bg);
      border: 1px solid var(--gtm-banner-border);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s, border-color 0.3s;
    }

    .gtm-top-bar i {
      font-size: 1.2rem;
      color: #61dafb;
    }
    body.light-mode .gtm-top-bar i { color: var(--accent-color); }

    /* Toggle Switch Stylings */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }

    .gtm-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .container { display: grid; grid-template-columns: 380px 1fr; gap: 20px; height: calc(100vh - 130px); }

    .sidebar { background: var(--bg-sidebar); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 15px; overflow-y: auto; transition: background 0.3s; }

      color: var(--text-main);

  <script>
    let inputEditor, outputEditor;

    function babelPluginAddBlockNewlines({ types: t }) {
      return {
        visitor: {
          BlockStatement(path) { processStatements(path.get('body'), t); },
          Program(path) { processStatements(path.get('body'), t); }
        }
      };

      function isBlockOrMultiline(node) {
        if (!node) return false;
        const type = node.type;
        const blockTypes = [
          'FunctionDeclaration', 'ClassDeclaration', 'IfStatement',
          'ForStatement', 'ForInStatement', 'ForOfStatement',
          'WhileStatement', 'DoWhileStatement', 'TryStatement',
          'SwitchStatement'
        ];
        if (blockTypes.includes(type)) return true;
        if (type === 'VariableDeclaration' && node.declarations.length > 1) return true;
        return false;
      }

      function processStatements(statements, t) {
        for (let i = 0; i < statements.length - 1; i++) {
          const current = statements[i].node;
          const next = statements[i + 1].node;

          if (isBlockOrMultiline(current) || isBlockOrMultiline(next)) {
            if (!next.leadingComments) {
              next.leadingComments = [];
            }
            const hasMarker = next.leadingComments.some(c => c.value === 'BLOCK_NEWLINE');
            if (!hasMarker) {
              next.leadingComments.push({
                type: 'CommentBlock',
                value: 'BLOCK_NEWLINE',
                leading: true
              });
            }
          }
        }
      }
    }

    function babelPluginModernizeVars({ types: t }) {
      return {
        visitor: {
          VariableDeclaration(path) {
            if (path.node.kind !== 'var') return;

            const isForInit =
              (path.parentPath.isForStatement() && path.parentKey === 'init') ||
              path.parentPath.isForInStatement() ||
              path.parentPath.isForOfStatement();

            if (isForInit) {
              let isConstant = true;
              for (const decl of path.node.declarations) {
                if (t.isIdentifier(decl.id)) {
                  const binding = path.scope.getBinding(decl.id.name);
                  if (binding && !binding.constant) {
                    isConstant = false;
                  }
                }
              }
              path.node.kind = isConstant ? 'const' : 'let';
              return;
            }

            const constDecls = [];
            const letDecls = [];

            for (const decl of path.node.declarations) {
              let isConstant = true;

              if (t.isIdentifier(decl.id)) {
                const binding = path.scope.getBinding(decl.id.name);
                if (binding && !binding.constant) {
                  isConstant = false;
                }
              }

              if (isConstant) {
                constDecls.push(decl);
              } else {
                letDecls.push(decl);
              }
            }

            const newDeclarations = [];
            if (constDecls.length > 0) newDeclarations.push(t.variableDeclaration('const', constDecls));
            if (letDecls.length > 0) newDeclarations.push(t.variableDeclaration('let', letDecls));

            if (newDeclarations.length === 1) {
              path.replaceWith(newDeclarations[0]);
            } else if (newDeclarations.length > 1) {
              path.replaceWithMultiple(newDeclarations);
            }
          }
        }
      };
    }

    function babelPluginSplitVars({ types: t }) {
      return {
        visitor: {
          VariableDeclaration(path) {
            if (
              path.parentPath.isForInStatement() ||
              path.parentPath.isForOfStatement() ||
              (path.parentPath.isForStatement() && path.parentKey === 'init')
            ) {
              return;
            }
            if (path.node.declarations.length > 1) {
              const kind = path.node.kind;
              const newDeclarations = path.node.declarations.map(decl =>
                t.variableDeclaration(kind, [decl])
              );
              path.replaceWithMultiple(newDeclarations);
            }
          }
        }
      };
    }

    function babelPluginGroupVars({ types: t }) {
      return {
        visitor: {
          BlockStatement(path) { groupInBlock(path); },
          Program(path) { groupInBlock(path); }
        }
      };

      function groupInBlock(path) {
        const body = path.get('body');
        for (let i = 0; i < body.length - 1; i++) {
          const current = body[i];
          const next = body[i + 1];

          if (
            current.isVariableDeclaration() &&
            next.isVariableDeclaration() &&
            current.node.kind === next.node.kind &&
            !current.parentPath.isForStatement() &&
            !next.parentPath.isForStatement()
          ) {
            current.node.declarations.push(...next.node.declarations);
            next.remove();
            i--;
          }
        }
      }
    }

    function babelPluginRemoveUnderscorePrefixes() {
      return {
        visitor: {
          Program(path) {
            path.traverse({
              VariableDeclarator(p) {
                if (p.node.id && p.node.id.type === 'Identifier') {
                  const name = p.node.id.name;
                  if (/^_[a-zA-Z0-9]+$/.test(name)) {
                    const cleanName = name.replace(/^_+/, '');
                    const existingBinding = p.scope.hasBinding(cleanName);
                    if (!existingBinding || p.scope.getBinding(cleanName) === p.scope.getBinding(name)) {
                      p.scope.rename(name, cleanName);
                    }
                  }
                }
              }
            });
          }
        }
      };
    }

    async function writePureTextToClipboard(text) {
      try {
        const blob = new Blob([text], { type: 'text/plain' });
        const item = new ClipboardItem({ 'text/plain': blob });
        await navigator.clipboard.write([item]);
      } catch (e) {
        await navigator.clipboard.writeText(text);
      }
    }

    function enforcePlainTextCopy(cmInstance) {
      cmInstance.on('copy', (cm, event) => {
        const selectedText = cm.getSelection();
        if (selectedText) {
          event.preventDefault();
          if (event.clipboardData) {
            event.clipboardData.clearData();
            event.clipboardData.setData('text/plain', selectedText);
          } else {
            writePureTextToClipboard(selectedText);
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const defaultCode = `function() {
  var test = {{tester}};
  var idGTM = 'GTM-XXXXX';
  var contador = 0;

  if (contador === 0) {
    contador = 1;
  }

  return test + '_' + idGTM;
}`;

      inputEditor = CodeMirror.fromTextArea(document.getElementById('inputCode'), {
        mode: 'javascript',
        theme: 'dracula',
        lineNumbers: true,
        lineWrapping: true
      });

      outputEditor = CodeMirror.fromTextArea(document.getElementById('outputCode'), {
        mode: 'javascript',
        theme: 'dracula',
        lineNumbers: true,
        readOnly: true,
        lineWrapping: true
      });

      enforcePlainTextCopy(inputEditor);
      enforcePlainTextCopy(outputEditor);

      inputEditor.setValue(defaultCode);
    });

    async function copyInput() {
      const code = inputEditor.getValue();
      if (!code.trim()) {
        showStatus('Nenhum código na ENTRADA para copiar.', 'warning');
        return;
      }
      await writePureTextToClipboard(code);
      showStatus('✓ Código de ENTRADA copiado como texto puro!', 'success');
    }

    async function copyOutput() {
      const code = outputEditor.getValue();
      if (!code.trim()) {
        showStatus('Nenhum código na SAÍDA para copiar.', 'warning');
        return;
      }
      await writePureTextToClipboard(code);
      showStatus('✓ Código de SAÍDA copiado como texto puro!', 'success');
    }

    function swapEditors() {
      const outputCode = outputEditor.getValue();
      if (!outputCode.trim()) {
        showStatus('Não há código na saída para inverter.', 'warning');
        return;
      }
      inputEditor.setValue(outputCode);
      outputEditor.setValue('');
      showStatus('⇄ Código de saída movido para a entrada!', 'success');
    }

    function updateFont() {
      const font = document.getElementById('fontFamily').value;
      document.documentElement.style.setProperty('--code-font', font);
      if (inputEditor) inputEditor.refresh();
      if (outputEditor) outputEditor.refresh();
    }

    function updateTheme() {
      const themeSelect = document.getElementById('colorTheme');
      const selectedTheme = themeSelect.value;
      const isLight = selectedTheme === 'eclipse' || selectedTheme === 'neo';

      inputEditor.setOption('theme', selectedTheme);
      outputEditor.setOption('theme', selectedTheme);

      if (isLight) {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }
    }

    function sanitizeGTMInput(code) {
      const gtmVars = [];
      let processedCode = code;

      // 1. Substituir variáveis GTM {{var}} por identificadores válidos
      processedCode = processedCode.replace(/\{\{\s*([\w\s-]+?)\s*\}\}/g, (match, p1) => {
        const placeholder = `__GTM_VAR_${gtmVars.length}__`;
        gtmVars.push({ placeholder, original: match });
        return placeholder;
      });

      // 2. Verificar se inicia com função anônima e envolver com ()
      let isWrappedAnonFunc = false;
      const trimmed = processedCode.trim();
      if (/^function\s*\(/i.test(trimmed)) {
        processedCode = `(${trimmed})`;
        isWrappedAnonFunc = true;
      }

      return { processedCode, gtmVars, isWrappedAnonFunc };
    }

    function restoreGTMOutput(code, gtmVars, isWrappedAnonFunc) {
      let restoredCode = code;

      // 1. Restaurar variáveis {{var}}
      for (const item of gtmVars) {
        restoredCode = restoredCode.split(item.placeholder).join(item.original);
      }

      // 2. Remover parênteses externos se foi envolvido temporariamente
      if (isWrappedAnonFunc) {
        restoredCode = restoredCode.trim();

        if (restoredCode.startsWith(';')) {
          restoredCode = restoredCode.slice(1).trim();
        }

        if (restoredCode.startsWith('(') && (restoredCode.endsWith(');') || restoredCode.endsWith(')'))) {
          const hasEndingSemicolon = restoredCode.endsWith(';');
          restoredCode = restoredCode.slice(1, hasEndingSemicolon ? -2 : -1).trim();
          if (hasEndingSemicolon) {
            restoredCode += ';';
          }
        }
      }

      return restoredCode;
    }

    async function processJavaScript() {
      const rawCode = inputEditor.getValue();

      if (!rawCode.trim()) {
        showStatus('Insira código para formatar.', 'warning');
        outputEditor.setValue('');
        return;
      }

      const isGtmMode = document.getElementById('gtmMode').checked;

      let codeToProcess = rawCode;
      let gtmVars = [];
      let isWrappedAnonFunc = false;

      if (isGtmMode) {
        const sanitized = sanitizeGTMInput(rawCode);
        codeToProcess = sanitized.processedCode;
        gtmVars = sanitized.gtmVars;
        isWrappedAnonFunc = sanitized.isWrappedAnonFunc;
      }

      try {
        Babel.transform(codeToProcess, { presets: [] });
      } catch (err) {
        let msg = err.message;
        if (isGtmMode) {
          msg += '\n\nNota: O modo GTM JavaScript está ATIVADO no topo.';
        }
        showStatus(`Sintaxe Inválida! Corrija os erros antes de formatar:\n${msg}`, 'error');
        outputEditor.setValue('');
        return;
      }

      const blockNewlines = document.getElementById('blockNewlines').value === 'true';
      const maxOneEmptyLine = document.getElementById('maxOneEmptyLine').value === 'true';
      const varModernize = document.getElementById('varModernize').value === 'true';
      const varGrouping = document.getElementById('varGrouping').value;
      const targetVersion = document.getElementById('jsVersion').value;

      const babelPlugins = [];

      if (blockNewlines) {
        babelPlugins.push(babelPluginAddBlockNewlines);
      }

      if (varModernize) {
        babelPlugins.push(babelPluginModernizeVars);
      }

      if (varGrouping === 'split') {
        babelPlugins.push(babelPluginSplitVars);
      } else if (varGrouping === 'group') {
        babelPlugins.push(babelPluginGroupVars);
      }

      babelPlugins.push(babelPluginRemoveUnderscorePrefixes);

      let transformedCode = codeToProcess;

      try {
        const presets = [];
        if (targetVersion === 'es5' || targetVersion === 'es3') {
          const targets = targetVersion === 'es3' ? 'ie 8' : 'ie 11';
          presets.push(['env', { targets: targets, modules: false }]);
          babelPlugins.push('transform-property-literals', 'transform-member-expression-literals');
        }

        const babelResult = Babel.transform(codeToProcess, {
          presets: presets,
          plugins: babelPlugins
        });
        transformedCode = babelResult.code;

        if (blockNewlines) {
          transformedCode = transformedCode.replace(/\/\*BLOCK_NEWLINE\*\/\s*/g, '\n\n');
        } else {
          transformedCode = transformedCode.replace(/\/\*BLOCK_NEWLINE\*\/\s*/g, '');
        }

      } catch (err) {
        showStatus(`Erro na transformação do Babel: ${err.message}`, 'error');
        return;
      }

      const tabWidth = document.getElementById('indentation').value === 'tab' ? 2 : parseInt(document.getElementById('indentation').value);
      const useTabs = document.getElementById('indentation').value === 'tab';

      const prettierOptions = {
        parser: 'babel',
        plugins: [prettierPlugins.babel, prettierPlugins.estree],
        tabWidth: tabWidth,
        useTabs: useTabs,
        singleQuote: document.getElementById('quotes').value === 'single',
        semi: document.getElementById('semicolons').value === 'true',
        printWidth: parseInt(document.getElementById('printWidth').value),
        bracketSpacing: document.getElementById('bracketSpacing').value === 'true',
        trailingComma: document.getElementById('trailingComma').value,
      };

      try {
        let finalCode = await prettier.format(transformedCode, prettierOptions);

        if (maxOneEmptyLine) {
          finalCode = finalCode.replace(/\n\s*\n\s*\n+/g, '\n\n');
        }

        if (isGtmMode) {
          finalCode = restoreGTMOutput(finalCode, gtmVars, isWrappedAnonFunc);
        }

        outputEditor.setValue(finalCode);
        showStatus('Sucesso! Código higienizado e formatado mantendo a estrutura exata de variáveis.', 'success');
      } catch (err) {
        showStatus(`Erro interno de formatação do Prettier: ${err.message}`, 'error');
      }
    }

    function showStatus(message, type) {
      const statusBar = document.getElementById('statusBar');
      statusBar.textContent = message;
      statusBar.className = `status-bar ${type}`;
    }
  </script>
</body>
</html>
