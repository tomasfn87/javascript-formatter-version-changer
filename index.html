<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script>(function (w, d, s, l, i) {
      w[l] = w[l] || []; w[l].push({
        'gtm.start':
          new Date().getTime(), event: 'gtm.js'
      }); var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-P8BZ94R6');</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTM/JS Code Analyzer & Beautifier</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inconsolata:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=Source+Code+Pro:wght@400;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://unpkg.com/prettier@3.2.5/standalone.js"></script>
  <script src="https://unpkg.com/prettier@3.2.5/plugins/babel.js"></script>
  <script src="https://unpkg.com/prettier@3.2.5/plugins/estree.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P8BZ94R6" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>

  <div class="header-container">
    <div class="header-title-box">
      <h1><i class="fa-solid fa-code"></i> JS Beautifier & Version Changer</h1>
      <div class="subtitle">Otimizado para Scripts do Google Tag Manager (GTM) e aplicações Web</div>
    </div>

    <label class="gtm-top-bar" for="gtmMode">
      <i class="fa-solid fa-tags"></i>
      <span class="gtm-label">GTM JavaScript Mode</span>
      <span class="switch">
        <input type="checkbox" id="gtmMode" checked>
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <div class="container">
    <div class="sidebar">

      <div class="section-title"><i class="fa-solid fa-palette"></i> I) Aparência & Tema</div>
      <div class="form-group">
        <label>Esquema de Cores</label>
        <select id="colorTheme" onchange="updateTheme()">
          <optgroup label="Escuro (Dark Mode)">
            <option value="dracula" selected>Dracula (VS Code Dark)</option>
            <option value="monokai">Monokai</option>
            <option value="material">Material Dark</option>
          </optgroup>
          <optgroup label="Claro (Light Mode)">
            <option value="eclipse">Eclipse (Light)</option>
            <option value="neo">Neo White (Light)</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label>Fonte do Código (Open-Source)</label>
        <select id="fontFamily" onchange="updateFont()">
          <option value="'Fira Code', monospace" selected>Fira Code</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          <option value="'Roboto Mono', monospace">Roboto Mono</option>
          <option value="'Source Code Pro', monospace">Source Code Pro</option>
          <option value="'Inconsolata', monospace">Inconsolata</option>
          <option value="'Space Mono', monospace">Space Mono</option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-indent"></i> II) Indentação</div>
      <div class="form-group">
        <label title="Tamanho e Tipo">Tamanho e Tipo</label>
        <select id="indentation">
          <option value="2" data-value="indent-2">2 Espaços (Padrão JS)</option>
          <option value="4" data-value="indent-4">4 Espaços</option>
          <option value="tab" data-value="indent-tab">Tabulações (Tabs)</option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-paragraph"></i> III) Blocos & Espaçamento Vertical</div>
      <div class="form-group">
        <label title="Pular linha entre blocos de código">Pular linha entre blocos de código</label>
        <select id="blockNewlines">
          <option value="true" data-value="skip-line-after-block" selected>Ativado (Recomendado)</option>
          <option value="false" data-value="never-skip-lines">Desativado (Manter blocos contínuos)</option>
        </select>
      </div>
      <div class="form-group">
        <label title="Limitar linhas vazias contíguas">Limitar linhas vazias contíguas</label>
        <select id="maxOneEmptyLine">
          <option value="true" data-value="limit-empty-lines" selected>Ativado (Máximo 1 linha vazia)</option>
          <option value="false" data-value="limitless-empty-lines">Desativado (Permitir múltiplas linhas vazias)
          </option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-diagram-project"></i> IV) Declaração de Variáveis</div>
      <div class="form-group">
        <label title="Modernizar var | const | let">Modernizar var | const | let</label>
        <select id="varModernize">
          <option value="false" data-value="keep-original-variable-keyword" selected>Manter palavras-chave originais
            (var/let/const)</option>
          <option value="true" data-value="use-const-and-let">Converter var para const (fixo) e let (mutável)</option>
        </select>
      </div>
      <div class="form-group">
        <label title="Estrutura de Agrupamento">Estrutura de Agrupamento</label>
        <select id="varGrouping">
          <option value="none" data-value="keep-original-variable-keyword-grouping" selected>Manter original</option>
          <option value="split" data-value="one-variable-keyword-for-each">Separar (1 keyword por variável)</option>
          <option value="group" data-value="group-variables-with-same-keyword">Agrupar sob mesma keyword</option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-sliders"></i> V) Estilo Básico</div>
      <div class="form-group">
        <label title="Aspas">Aspas</label>
        <select id="quotes">
          <option value="single" data-value="single-quotes">Aspas Simples (')</option>
          <option value="double" data-value="double-quotes">Aspas Duplas (")</option>
        </select>
      </div>
      <div class="form-group">
        <label title="Ponto e Vírgula">Ponto e Vírgula</label>
        <select id="semicolons">
          <option value="true" data-value="always-use">Sempre usar (;)</option>
          <option value="false" data-value="skip-when-possible">Omitir quando possível</option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-arrows-left-right-to-line"></i> VI) Largura & Detalhes</div>
      <div class="form-group">
        <label title="Largura Máxima (Print Width)">Largura Máxima (Print Width)</label>
        <select id="printWidth">
          <option value="80" data-value="max-80-chars">80 caracteres</option>
          <option value="100" data-value="max-100-chars">100 caracteres</option>
          <option value="120" data-value="max-120-chars">120 caracteres</option>
        </select>
      </div>
      <div class="form-group">
        <label title="Espaço em Chaves { x: 1 }">Espaço em Chaves { x: 1 }</label>
        <select id="bracketSpacing">
          <option value="true" data-value="with-bracket-spacing">Sim ({ foo: bar })</option>
          <option value="false" data-value="no-bracket-spacing">Não ({foo: bar})</option>
        </select>
      </div>
      <div class="form-group">
        <label title="Vírgula Final (Trailing Comma)">Vírgula Final (Trailing Comma)</label>
        <select id="trailingComma">
          <option value="all" data-value="always-use-trailing-commas">Sempre</option>
          <option value="es5" data-value="only-es5-valid-trailing-commas">Apenas válidas em ES5</option>
          <option value="none" data-value="never-use-trailing-commas">Nunca</option>
        </select>
      </div>

      <div class="section-title"><i class="fa-solid fa-bullseye"></i> VII) Versão Target</div>
      <div class="form-group">
        <label title="Alvo do Babel">Alvo do Babel</label>
        <select id="jsVersion">
          <option value="modern" data-value="es-next">Moderno (ESNext)</option>
          <option value="es5" data-value="es5">ES5 (GTM Legado / IE11)</option>
          <option value="es3" data-value="es3">ES3 (IE8)</option>
        </select>
      </div>

    </div>

    <div class="editor-section">
      <div class="actions-bar">
        <button id="format-javascript" class="btn-primary" onclick="processJavaScript()"><i
            class="fa-solid fa-wand-magic-sparkles"></i> Formatar</button>
        <button id="send-output-to-input" class="btn-swap" onclick="swapEditors()"
          title="Mover código da Saída para a Entrada"><i class="fa-solid fa-arrows-rotate"></i> Inverter</button>
      </div>

      <div id="statusBar" class="status-bar"></div>

      <div class="editors">
        <div class="editor-box">
          <div class="editor-header">
            <label>Código Original:</label>
            <button class="btn-copy" onclick="copyInput()"><i class="fa-regular fa-copy"></i> Copiar Entrada</button>
          </div>
          <textarea id="inputCode"></textarea>
        </div>

        <div class="editor-box">
          <div class="editor-header">
            <label>Código Formatado / Beautified:</label>
            <button class="btn-copy" onclick="copyOutput()"><i class="fa-regular fa-copy"></i> Copiar Saída</button>
          </div>
          <textarea id="outputCode"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="script.js"></script>

</body>

</html>
